<!DOCTYPE html>
<html lang="und" style="width:100%;height:100%;background-color:black;">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">

<meta name="description" content="Eaglercraft 1.14.4 test directory HTML page">

<meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.14">

<title>Eaglercraft 1.14.4</title>

<link type="image/png" rel="shortcut icon" href="favicon.png">

<style>

#launch_screen {

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

    user-select:none;

    font-family:sans-serif;

    z-index:9999;

}

.launch_box {

    text-align:center;

    transform:translateY(-40px);

}

.launch_box h1 {

    margin-bottom:25px;

}

.launch_text {

    font-weight:bold;

}


#progress {

    border:2px solid black;

    width:300px;

    height:15px;

    padding:1px;

    margin:20px auto;

}


#progress_bar {

    background:#b00000;

    width:0%;

    height:100%;

}


.github_text a {

    color:black;

    font-weight:bold;

    text-decoration:none;

}


.github_text span {

    color:#8b0000;

    text-decoration:underline;

}


button {

    cursor:pointer;

}

</style>


<script type="text/javascript" src="textures.js"></script>

<script type="text/javascript" src="u5-new.js"></script>


<script type="text/javascript">

"use strict";

window.addEventListener("load", function(){

if(window.location.href.indexOf("file:") === 0){

alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");

}else{

window.eaglercraftXOpts = {

demoMode:false,

container:"game_frame",

assetsURI:"assets.epk",

localesURI:"lang/",

worldsDB:"worlds",

servers:[

{
addr:"wss://play.zelz.net",
name:"ZelzNet"
},

{
addr:"wss://mc.arch.lol",
name:"ArchMC"
},

{
addr:"wss://arch.mc",
name:"another ArchMC server"
}

]

};


var launchCounter = 1;

var launchSkipCountdown = false;


var countdown =
document.getElementById("countdown");


var progress =
document.getElementById("progress_bar");


var timer=setInterval(function(){

countdown.innerText =
Math.floor(6 - launchCounter * 0.06);


progress.style.width =
launchCounter + "%";


launchCounter++;


if(launchCounter > 100 || launchSkipCountdown){

clearInterval(timer);

document.getElementById("launch_screen").remove();

main();

}

},50);


document.getElementById("skip").onclick=function(){

launchSkipCountdown=true;

};

}

});

</script>

</head>


<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">


<div id="launch_screen">


<div class="launch_box">


<h1>
This file is from 06/14/2026
</h1>


<p class="github_text">

<a href="https://github.com/UserArham" target="_blank">

or you can check my <span>GitHub repo</span>

</a>

</p>


<h2 class="launch_text">

Game will launch in

<span id="countdown">5</span>...

</h2>


<div id="progress">

<div id="progress_bar"></div>

</div>


<p>

<button id="skip">

Skip Countdown

</button>

</p>


</div>

</div>


</body>

</html>
