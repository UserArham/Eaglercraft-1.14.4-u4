<html style="width:100%;height:100%;background-color:black;">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>This file is from 05/17/2026</title>


<style>

html, body {
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:black;
    font-family:sans-serif;
}


#launch_countdown_screen {

    width:100%;
    height:100%;

    display:flex;

    align-items:center;

    user-select:none;

}


.launch_box {

    margin:auto;

    text-align:center;

}


h1 {

    color:black;

}


h2 {

    color:black;

}


.progress {

    border:2px solid black;

    width:300px;

    height:15px;

    padding:1px;

    margin:auto;

}


#launchCountdownProgress {

    background:#555;

    width:0%;

    height:100%;

}


button {

    cursor:pointer;

}

</style>


</head>


<body id="game_frame">


<div id="launch_countdown_screen">


<div class="launch_box">


<h1>
This file is from 05/17/2026
</h1>


<h2>
Game will launch in
<span id="launchCountdownNumber">5</span>...
</h2>


<div class="progress">

<div id="launchCountdownProgress"></div>

</div>


<p style="margin-top:30px;">

<button id="skipCountdown" autofocus>
Skip Countdown
</button>

&emsp;

<button id="bootMenu">
Enter Boot Menu
</button>

</p>


</div>


</div>



<script>

"use strict";


var launchInterval = -1;

var launchCounter = 1;

var launchSkipCountdown = false;


var launchCountdownNumberElement = null;

var launchCountdownProgressElement = null;



function launchTick(){


    if(
        !launchCountdownNumberElement ||
        !launchCountdownProgressElement
    ){
        return;
    }


    launchCountdownNumberElement.innerText =
        "" + Math.floor(6.0 - launchCounter * 0.06);



    launchCountdownProgressElement.style.width =
        launchCounter + "%";



    launchCounter++;



    if(
        launchCounter > 100 ||
        launchSkipCountdown
    ){


        clearInterval(launchInterval);

        launchInterval = -1;



        window.location.replace(
            "index.html"
        );


    }

}



window.addEventListener(
"load",
function(){


    launchCountdownNumberElement =
        document.getElementById(
            "launchCountdownNumber"
        );


    launchCountdownProgressElement =
        document.getElementById(
            "launchCountdownProgress"
        );



    launchInterval =
        setInterval(
            launchTick,
            50
        );



    document.getElementById(
        "skipCountdown"
    ).onclick=function(){


        launchSkipCountdown = true;


    };



    document.getElementById(
        "bootMenu"
    ).onclick=function(){


        launchSkipCountdown = true;


    };


});




// Stop timer when leaving page
window.addEventListener(
"pagehide",
function(){


    if(launchInterval !== -1){

        clearInterval(
            launchInterval
        );

        launchInterval = -1;

    }


});




// Fix browser back-cache freezing
window.addEventListener(
"pageshow",
function(event){


    if(event.persisted){

        window.location.reload();

    }


});


</script>


</body>

</html>
